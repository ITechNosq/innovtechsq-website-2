<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR Manager | Innovtechnosq</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0F172A] text-slate-100 font-[Inter] min-h-screen">
    <div class="hero-glow"></div>

    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="glass-nav px-8 py-6">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-blue-500 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                        <i class="fas fa-shield-halved text-white text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold tracking-tight">SR Manager</h1>
                        <p class="text-xs text-slate-500 font-medium tracking-widest uppercase">Innovtechnosq Dashboard</p>
                    </div>
                </div>
                <div class="flex items-center gap-6">
                    <span id="status-indicator" class="px-3 py-1 bg-emerald-500/10 text-emerald-400 text-[10px] font-bold rounded-full border border-emerald-500/20 hidden uppercase tracking-wider">
                        <i class="fas fa-circle mr-1 text-[8px] animate-pulse"></i>Live
                    </span>
                    <button onclick="logout()" class="text-slate-400 hover:text-white transition-colors text-sm font-medium">
                        <i class="fas fa-power-off mr-2"></i>Logout
                    </button>
                </div>
            </div>
        </header>

        <!-- Password Modal (Glassmorphism) -->
        <div id="password-modal" class="fixed inset-0 bg-[#0F172A]/80 backdrop-blur-md flex items-center justify-center z-50 hidden">
            <div class="glass-panel p-10 max-w-md w-full mx-4 shadow-2xl">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 bg-blue-500/10 rounded-full flex items-center justify-center mx-auto mb-6 border border-blue-500/20">
                        <i class="fas fa-lock text-3xl text-blue-500"></i>
                    </div>
                    <h2 class="text-3xl font-bold mb-2">Secure Access</h2>
                    <p class="text-slate-400 text-sm">Enter administrator password</p>
                </div>
                <form id="password-form" class="space-y-6">
                    <input type="password" id="admin-password" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-4 focus:border-blue-500 outline-none transition-all" placeholder="••••••••">
                    <button type="submit" class="btn-premium w-full py-4 font-bold">Authenticate</button>
                </form>
            </div>
        </div>

        <!-- Main Content -->
        <main id="main-content" class="flex-1 p-8 max-w-7xl mx-auto w-full">
            <!-- Stats -->
            <div class="grid md:grid-cols-3 gap-6 mb-12">
                <div class="glass-panel p-8">
                    <div class="flex items-center gap-6">
                        <div class="w-14 h-14 bg-blue-500/10 rounded-2xl flex items-center justify-center border border-blue-500/20">
                            <i class="fas fa-layer-group text-blue-500 text-xl"></i>
                        </div>
                        <div>
                            <p class="text-xs text-slate-500 font-bold uppercase tracking-widest mb-1">Total Requests</p>
                            <p class="text-4xl font-bold" id="total-leads">0</p>
                        </div>
                    </div>
                </div>
                <div class="glass-panel p-8 border-emerald-500/20">
                    <div class="flex items-center gap-6">
                        <div class="w-14 h-14 bg-emerald-500/10 rounded-2xl flex items-center justify-center border border-emerald-500/20">
                            <i class="fas fa-bolt text-emerald-500 text-xl"></i>
                        </div>
                        <div>
                            <p class="text-xs text-slate-500 font-bold uppercase tracking-widest mb-1">New Today</p>
                            <p class="text-4xl font-bold" id="today-leads">0</p>
                        </div>
                    </div>
                </div>
                <div class="glass-panel p-8 border-orange-500/20">
                    <div class="flex items-center gap-6">
                        <div class="w-14 h-14 bg-orange-500/10 rounded-2xl flex items-center justify-center border border-orange-500/20">
                            <i class="fas fa-clock text-orange-500 text-xl"></i>
                        </div>
                        <div>
                            <p class="text-xs text-slate-500 font-bold uppercase tracking-widest mb-1">Recent (7d)</p>
                            <p class="text-4xl font-bold" id="week-leads">0</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SR Table -->
            <div class="glass-panel overflow-hidden">
                <div class="p-8 border-b border-slate-800 bg-white/5 flex flex-col md:flex-row justify-between items-center gap-6">
                    <div>
                        <h2 class="text-2xl font-bold flex items-center gap-3">
                            <i class="fas fa-list-check text-blue-500"></i>
                            Active Service Requests
                        </h2>
                    </div>
                    <div class="flex items-center gap-4 w-full md:w-auto">
                        <button onclick="refreshData()" class="btn-glass py-2 px-6 text-sm flex items-center gap-2">
                            <i class="fas fa-rotate"></i> Sync
                        </button>
                        <button onclick="exportCSV()" class="bg-emerald-600/20 text-emerald-400 border border-emerald-600/30 py-2 px-6 rounded-xl text-sm hover:bg-emerald-600/30 transition-all flex items-center gap-2">
                            <i class="fas fa-file-csv"></i> Export
                        </button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left sr-table">
                        <thead>
                            <tr class="text-slate-500 text-[11px] uppercase tracking-widest">
                                <th class="px-8 py-6 font-bold">SR ID</th>
                                <th class="px-8 py-6 font-bold">Client Name</th>
                                <th class="px-8 py-6 font-bold">Service Type</th>
                                <th class="px-8 py-6 font-bold">Status</th>
                                <th class="px-8 py-6 font-bold text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="leads-table-body">
                            <!-- Data injected here -->
                            <tr>
                                <td colspan="5" class="px-8 py-20 text-center text-slate-500">
                                    <i class="fas fa-circle-notch animate-spin text-2xl mb-4"></i>
                                    <p>Awaiting Authentication...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/config.js"></script>
    <script>
        const API_URL = window.CONFIG?.API_URL || 'http://localhost:8000';
        let accessToken = localStorage.getItem('admin_token');
        let leadsData = [];
        
        document.addEventListener('DOMContentLoaded', () => {
            if (accessToken) {
                document.getElementById('main-content').classList.remove('hidden');
                document.getElementById('status-indicator').classList.remove('hidden');
                refreshData();
            } else {
                document.getElementById('password-modal').classList.remove('hidden');
            }
        });
        
        document.getElementById('password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('admin-password').value;
            const btn = e.target.querySelector('button');
            
            btn.innerHTML = '<i class="fas fa-circle-notch animate-spin"></i>';
            btn.disabled = true;
            
            try {
                const formData = new URLSearchParams();
                formData.append('username', 'admin');
                formData.append('password', password);
                
                const response = await fetch(`${API_URL}/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                
                if (response.ok) {
                    const data = await response.json();
                    accessToken = data.access_token;
                    localStorage.setItem('admin_token', accessToken);
                    location.reload();
                } else {
                    alert('Invalid Administrator Password');
                }
            } catch (err) {
                alert('Connection to Backend Failed');
            } finally {
                btn.textContent = 'Authenticate';
                btn.disabled = false;
            }
        });
        
        async function refreshData() {
            if (!accessToken) return logout();
            try {
                const [leadsRes, statsRes] = await Promise.all([
                    fetch(`${API_URL}/leads?limit=100`, { headers: { 'Authorization': `Bearer ${accessToken}` } }),
                    fetch(`${API_URL}/leads/stats`, { headers: { 'Authorization': `Bearer ${accessToken}` } })
                ]);
                
                if (leadsRes.status === 401) logout();
                
                if (leadsRes.ok) {
                    leadsData = await leadsRes.json();
                    renderLeads();
                }
                
                if (statsRes.ok) {
                    const stats = await statsRes.json();
                    document.getElementById('total-leads').textContent = stats.total;
                    document.getElementById('today-leads').textContent = stats.today;
                    document.getElementById('week-leads').textContent = stats.week;
                }
            } catch (err) { console.error(err); }
        }
        
        function renderLeads() {
            const tbody = document.getElementById('leads-table-body');
            if (leadsData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="px-8 py-20 text-center text-slate-500">No Service Requests found</td></tr>';
                return;
            }
            
            tbody.innerHTML = leadsData.map(sr => `
                <tr class="sr-row border-b border-slate-800/50">
                    <td class="px-8 py-6 font-mono text-blue-400 text-xs">SR-${sr.id.toString().padStart(4, '0')}</td>
                    <td class="px-8 py-6">
                        <div class="font-bold text-white">${sr.name}</div>
                        <div class="text-[10px] text-slate-500 font-medium">${sr.email}</div>
                    </td>
                    <td class="px-8 py-6">
                        <span class="px-3 py-1 bg-blue-500/10 border border-blue-500/20 text-blue-400 text-[10px] font-bold rounded-lg uppercase">
                            ${sr.service_type || 'General IT'}
                        </span>
                    </td>
                    <td class="px-8 py-6">
                        <span class="px-3 py-1 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[10px] font-bold rounded-lg uppercase">
                            New
                        </span>
                    </td>
                    <td class="px-8 py-6 text-right">
                        <div class="flex justify-end gap-3">
                            <a href="tel:${sr.phone}" class="w-8 h-8 flex items-center justify-center rounded-lg bg-blue-500/10 text-blue-400 hover:bg-blue-500 text-white transition-all">
                                <i class="fas fa-phone text-xs"></i>
                            </a>
                            <button onclick="window.open('https://wa.me/${sr.phone.replace(/\D/g,'')}')" class="w-8 h-8 flex items-center justify-center rounded-lg bg-green-500/10 text-green-400 hover:bg-green-500 text-white transition-all">
                                <i class="fab fa-whatsapp text-xs"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function exportCSV() {
            const rows = [['SR ID', 'Date', 'Name', 'Email', 'Phone', 'Type', 'Message']];
            leadsData.forEach(sr => rows.push([`SR-${sr.id}`, sr.created_at, sr.name, sr.email, sr.phone, sr.service_type, sr.message]));
            const csv = rows.map(r => r.map(c => `"${c}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `innovtechnosq-sr-export.csv`;
            a.click();
        }

        function logout() {
            localStorage.removeItem('admin_token');
            location.reload();
        }
    </script>
</body>
</html>
